<text x="262.0" y="393" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">10</text>
<rect x="292" y="372" width="44" height="32" rx="8" fill="#5B6470" stroke="#5B6470" stroke-width="2"/>
