<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">ESP32 GPIOs by category</title>
<desc id="d">Free pins, strapping pins, input-only pins, pins reserved for the flash and serial port pins on the original ESP32.</desc>
<rect x="1" y="1" width="798" height="638" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
<text x="32" y="44" font-size="19" font-weight="700" fill="#14192A">Original ESP32: which GPIOs to use</text>
<text x="32" y="68" font-size="14" fill="#5B6470">Grouped by function, not by physical position on the board</text>
<text x="32" y="108" font-size="16" font-weight="700" fill="#14192A">Free to use<tspan dx="10" font-weight="400" fill="#5B6470" font-size="14">general purpose input and output</tspan></text>
