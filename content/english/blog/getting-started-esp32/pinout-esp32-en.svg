<rect x="344" y="372" width="44" height="32" rx="8" fill="#5B6470" stroke="#5B6470" stroke-width="2"/>
<text x="366.0" y="393" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">16</text>
<rect x="396" y="372" width="44" height="32" rx="8" fill="#5B6470" stroke="#5B6470" stroke-width="2"/>
<text x="418.0" y="393" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">17</text>
<text x="32" y="444" font-size="16" font-weight="700" fill="#14192A">USB serial<tspan dx="10" font-weight="400" fill="#5B6470" font-size="14">serial monitor and firmware upload</tspan></text>
<rect x="32" y="456" width="68" height="32" rx="8" fill="#FFFFFF" stroke="#14192A" stroke-width="2"/>
<text x="66.0" y="477" font-size="15" font-weight="600" fill="#14192A" text-anchor="middle">1 TX</text>
<rect x="108" y="456" width="68" height="32" rx="8" fill="#FFFFFF" stroke="#14192A" stroke-width="2"/>
<text x="142.0" y="477" font-size="15" font-weight="600" fill="#14192A" text-anchor="middle">3 RX</text>
<rect x="32" y="516" width="736" height="104" rx="12" fill="#F4F8EC" stroke="#E5E8DF"/>
<circle cx="52" cy="545" r="4" fill="#E08A14"/>
<text x="66" y="550" font-size="15" fill="#14192A">3.3 V logic: never connect 5 V to a GPIO.</text>
<circle cx="52" cy="573" r="4" fill="#E08A14"/>
<text x="66" y="578" font-size="15" fill="#14192A">With WiFi active, ADC2 does not work: read analogue inputs on ADC1 (GPIO 32 to 39).</text>
<circle cx="52" cy="601" r="4" fill="#E08A14"/>
<text x="66" y="606" font-size="15" fill="#14192A">Every board numbers and orders its pins its own way: check your board's pinout.</text>
