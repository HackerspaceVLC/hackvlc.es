<text x="32" y="360" font-size="16" font-weight="700" fill="#14192A">Reserved<tspan dx="10" font-weight="400" fill="#5B6470" font-size="14">module flash (6-11) and PSRAM on WROVER modules (16, 17)</tspan></text>
