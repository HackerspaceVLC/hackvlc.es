<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">From photos to a traced PCB</title>
<desc id="d">Four steps: photograph the top side, mirror the photo of the bottom side, overlay both by aligning the holes and trace the nets with one colour per net.</desc>
<rect x="1" y="1" width="798" height="378" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
<text x="30" y="48" font-size="20" font-weight="700" fill="#14192A">From photos to traced nets</text>
<rect x="30" y="72" width="170" height="280" rx="12" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
<circle cx="52" cy="96" r="13" fill="#7FA82E"/>
<text x="52" y="101" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<g transform="translate(40 120)"><rect x="0" y="0" width="150" height="150" rx="8" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><circle cx="30" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="75" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="75" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><g opacity="1.0"><rect x="40" y="27" width="26" height="16" rx="4" fill="#9AA4B2"/><line x1="30" y1="35" x2="40" y2="35" stroke="#5B6470" stroke-width="2"/><line x1="66" y1="35" x2="75" y2="35" stroke="#5B6470" stroke-width="2"/><rect x="20" y="84" width="20" height="22" rx="4" fill="#9AA4B2"/><rect x="106" y="22" width="28" height="106" rx="4" fill="#5B6470"/><circle cx="113" cy="30" r="3" fill="#FFFFFF"/><rect x="62" y="104" width="26" height="22" rx="3" fill="none" stroke="#5B6470" stroke-width="2"/></g></g>
<text x="115.0" y="304" font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">Top side</text>
<text x="115.0" y="328" font-size="14" fill="#5B6470" text-anchor="middle">shot straight on</text>
<path d="M206.0 187 l8 8 l-8 8" fill="none" stroke="#5B6470" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="220" y="72" width="170" height="280" rx="12" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
<circle cx="242" cy="96" r="13" fill="#E08A14"/>
<text x="242" y="101" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<g transform="translate(230 120)"><rect x="0" y="0" width="150" height="150" rx="8" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><path d="M120 35 L120 75" fill="none" stroke="#C9A063" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 35 L30 75" fill="none" stroke="#C9A063" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M120 115 L75 115 L30 115" fill="none" stroke="#C9A063" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="75" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="75" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/></g>
<text x="305.0" y="304" font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">Bottom side</text>
<text x="305.0" y="328" font-size="14" fill="#5B6470" text-anchor="middle">mirrored horizontally</text>
<path d="M396.0 187 l8 8 l-8 8" fill="none" stroke="#5B6470" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="410" y="72" width="170" height="280" rx="12" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
<circle cx="432" cy="96" r="13" fill="#7FA82E"/>
<text x="432" y="101" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<g transform="translate(420 120)"><rect x="0" y="0" width="150" height="150" rx="8" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><path d="M30 35 L30 75" fill="none" stroke="#C9A063" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 35 L120 75" fill="none" stroke="#C9A063" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 115 L75 115 L120 115" fill="none" stroke="#C9A063" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><g opacity="0.45"><rect x="40" y="27" width="26" height="16" rx="4" fill="#9AA4B2"/><line x1="30" y1="35" x2="40" y2="35" stroke="#5B6470" stroke-width="2"/><line x1="66" y1="35" x2="75" y2="35" stroke="#5B6470" stroke-width="2"/><rect x="20" y="84" width="20" height="22" rx="4" fill="#9AA4B2"/><rect x="106" y="22" width="28" height="106" rx="4" fill="#5B6470"/><circle cx="113" cy="30" r="3" fill="#FFFFFF"/><rect x="62" y="104" width="26" height="22" rx="3" fill="none" stroke="#5B6470" stroke-width="2"/></g><circle cx="30" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="75" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="35" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="75" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="115" r="6" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/></g>
<text x="495.0" y="304" font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">Overlay</text>
<text x="495.0" y="328" font-size="14" fill="#5B6470" text-anchor="middle">align by the holes</text>
<path d="M586.0 187 l8 8 l-8 8" fill="none" stroke="#5B6470" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="600" y="72" width="170" height="280" rx="12" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
<circle cx="622" cy="96" r="13" fill="#E08A14"/>
<text x="622" y="101" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<g transform="translate(610 120)"><rect x="0" y="0" width="150" height="150" rx="8" fill="#F3F4F6" stroke="#C9CED6" stroke-width="2"/><path d="M30 35 L30 75" fill="none" stroke="#7FA82E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M75 35 L120 75" fill="none" stroke="#E08A14" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 115 L75 115 L120 115" fill="none" stroke="#14192A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="35" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="75" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="30" cy="115" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="35" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="75" cy="115" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="35" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="75" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/><circle cx="120" cy="115" r="7" fill="#FFFFFF" stroke="#5B6470" stroke-width="2"/></g>
<text x="685.0" y="304" font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">Trace nets</text>
<text x="685.0" y="328" font-size="14" fill="#5B6470" text-anchor="middle">one colour per net</text>
</svg>
