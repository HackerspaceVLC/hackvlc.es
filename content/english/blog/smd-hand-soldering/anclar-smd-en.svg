<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Tack-one-pad method for soldering an SMD resistor</title>
  <rect x="1" y="1" width="798" height="378" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
  <text x="400" y="42" text-anchor="middle" font-size="18" font-weight="700" fill="#14192A">Tin one pad, tack the part, solder the rest</text>

  <defs>
    <g id="pads">
      <rect x="-70" y="-30" width="140" height="60" rx="6" fill="#DDE8C4"/>
      <rect x="-62" y="-26" width="42" height="52" rx="3" fill="#E08A14"/>
      <rect x="20" y="-26" width="42" height="52" rx="3" fill="#E08A14"/>
    </g>
    <g id="part">
      <rect x="-46" y="-20" width="92" height="40" rx="3" fill="#3A4150"/>
      <rect x="-46" y="-20" width="18" height="40" rx="3" fill="#B8C0CC"/>
      <rect x="28" y="-20" width="18" height="40" rx="3" fill="#B8C0CC"/>
    </g>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9AA4B2"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g transform="translate(140,160)">
    <use href="#pads"/>
    <ellipse cx="-41" cy="0" rx="17" ry="20" fill="#B8C0CC"/>
    <ellipse cx="-46" cy="-7" rx="5" ry="6" fill="#FFFFFF" fill-opacity="0.7"/>
  </g>

  <!-- Step 2 -->
  <g transform="translate(400,160)">
    <use href="#pads"/>
    <path d="M-46,-21 C-54,-20 -58,-12 -58,0 C-58,12 -54,20 -46,21 Z" fill="#B8C0CC"/>
    <use href="#part"/>
    <!-- tweezers -->
    <path d="M-28,-82 L-8,-22" stroke="#5B6470" stroke-width="5" stroke-linecap="round"/>
    <path d="M28,-82 L8,-22" stroke="#5B6470" stroke-width="5" stroke-linecap="round"/>
    <!-- soldering iron -->
    <path d="M-60,22 L-84,52 L-74,60 Z" fill="#14192A"/>
    <path d="M-79,56 L-108,92" stroke="#9AA4B2" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Step 3 -->
  <g transform="translate(660,160)">
    <use href="#pads"/>
    <path d="M-46,-21 C-54,-20 -58,-12 -58,0 C-58,12 -54,20 -46,21 Z" fill="#B8C0CC"/>
    <path d="M46,-21 C54,-20 58,-12 58,0 C58,12 54,20 46,21 Z" fill="#B8C0CC"/>
    <use href="#part"/>
  </g>

  <!-- arrows -->
  <line x1="236" y1="160" x2="296" y2="160" stroke="#9AA4B2" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="496" y1="160" x2="556" y2="160" stroke="#9AA4B2" stroke-width="3" marker-end="url(#ah)"/>

  <!-- labels -->
  <g font-size="14" text-anchor="middle">
    <circle cx="140" cy="276" r="14" fill="#7FA82E"/>
    <text x="140" y="281" fill="#FFFFFF" font-weight="700">1</text>
    <text x="140" y="314" font-size="16" font-weight="700" fill="#14192A">Tin one pad</text>
    <text x="140" y="338" fill="#5B6470">A little solder</text>
    <text x="140" y="358" fill="#5B6470">on just one pad</text>

    <circle cx="400" cy="276" r="14" fill="#7FA82E"/>
    <text x="400" y="281" fill="#FFFFFF" font-weight="700">2</text>
    <text x="400" y="314" font-size="16" font-weight="700" fill="#14192A">Place and tack</text>
    <text x="400" y="338" fill="#5B6470">Reflow that pad and</text>
    <text x="400" y="358" fill="#5B6470">slide the part in</text>

    <circle cx="660" cy="276" r="14" fill="#7FA82E"/>
    <text x="660" y="281" fill="#FFFFFF" font-weight="700">3</text>
    <text x="660" y="314" font-size="16" font-weight="700" fill="#14192A">Solder the rest</text>
    <text x="660" y="338" fill="#5B6470">Check alignment,</text>
    <text x="660" y="358" fill="#5B6470">solder and touch up</text>
  </g>
</svg>
