<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6470"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7FA82E"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E08A14"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="458" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
  <line x1="400" y1="30" x2="400" y2="430" stroke="#E5E8DF" stroke-width="2"/>

  <!-- Chat -->
  <text x="200" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#14192A">Chat</text>
  <text x="200" y="76" text-anchor="middle" font-size="14" fill="#5B6470">The model answers, you do the rest</text>

  <rect x="80" y="104" width="240" height="44" rx="10" fill="#FFF4E5" stroke="#E08A14" stroke-width="1.5"/>
  <text x="200" y="131" text-anchor="middle" font-size="15" fill="#14192A">You: ask a question</text>
  <line x1="200" y1="150" x2="200" y2="180" stroke="#5B6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="80" y="184" width="240" height="44" rx="10" fill="#F2F7E8" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="200" y="211" text-anchor="middle" font-size="15" fill="#14192A">Model: replies with text</text>
  <line x1="200" y1="230" x2="200" y2="260" stroke="#5B6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="80" y="264" width="240" height="44" rx="10" fill="#FFF4E5" stroke="#E08A14" stroke-width="1.5"/>
  <text x="200" y="291" text-anchor="middle" font-size="15" fill="#14192A">You: copy, test, fix</text>

  <path d="M80 286 H52 V126 H76" fill="none" stroke="#E08A14" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#o)"/>
  <text x="200" y="350" text-anchor="middle" font-size="15" fill="#E08A14" font-weight="600">If it fails, you go back to the chat by hand</text>
  <text x="200" y="422" text-anchor="middle" font-size="14" fill="#5B6470">You drive every turn of the loop</text>

  <!-- Agent -->
  <text x="600" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="#14192A">Agent</text>
  <text x="600" y="76" text-anchor="middle" font-size="14" fill="#5B6470">Model + tools + loop</text>

  <rect x="480" y="104" width="240" height="44" rx="10" fill="#FFF4E5" stroke="#E08A14" stroke-width="1.5"/>
  <text x="600" y="131" text-anchor="middle" font-size="15" fill="#14192A">You: set a goal</text>
  <line x1="600" y1="150" x2="600" y2="180" stroke="#5B6470" stroke-width="2" marker-end="url(#a)"/>
  <rect x="480" y="184" width="240" height="44" rx="10" fill="#F2F7E8" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="600" y="211" text-anchor="middle" font-size="15" fill="#14192A">Model: decides the step</text>

  <line x1="570" y1="230" x2="570" y2="270" stroke="#7FA82E" stroke-width="2" marker-end="url(#g)"/>
  <line x1="630" y1="272" x2="630" y2="232" stroke="#7FA82E" stroke-width="2" marker-end="url(#g)"/>
  <text x="560" y="256" text-anchor="end" font-size="14" fill="#5B6470">acts</text>
  <text x="640" y="256" font-size="14" fill="#5B6470">observes</text>

  <rect x="480" y="274" width="74" height="40" rx="20" fill="#FFFFFF" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="517" y="299" text-anchor="middle" font-size="14" fill="#14192A">read</text>
  <rect x="563" y="274" width="74" height="40" rx="20" fill="#FFFFFF" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="600" y="299" text-anchor="middle" font-size="14" fill="#14192A">edit</text>
  <rect x="646" y="274" width="74" height="40" rx="20" fill="#FFFFFF" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="683" y="299" text-anchor="middle" font-size="14" fill="#14192A">run</text>

  <path d="M720 206 H750 V362 H724" fill="none" stroke="#5B6470" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="762" y="287" font-size="14" fill="#5B6470" transform="rotate(90 762 287)" text-anchor="middle">when done</text>
  <rect x="480" y="340" width="240" height="44" rx="10" fill="#FFF4E5" stroke="#E08A14" stroke-width="1.5"/>
  <text x="600" y="367" text-anchor="middle" font-size="15" fill="#14192A">You: review the result</text>
  <text x="600" y="422" text-anchor="middle" font-size="14" fill="#5B6470">The loop repeats without you stepping in</text>
</svg>
