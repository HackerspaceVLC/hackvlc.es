<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Cuantización de float32 a int8</title>
  <desc id="d">Un peso en float32 ocupa 4 bytes y en int8 ocupa 1 byte. Un modelo de ejemplo con 100 000 pesos pasa de unos 400 KB a unos 100 KB.</desc>
  <rect x="1" y="1" width="798" height="408" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
  <text x="40" y="50" font-size="20" font-weight="700" fill="#14192A">Cuantización: de float32 a int8</text>

  <!-- per weight -->
  <text x="40" y="98" font-size="15" font-weight="600" fill="#5B6470">Un peso</text>
  <text x="40" y="140" font-size="16" font-weight="700" fill="#14192A">float32</text>
  <g fill="#EEF4E0" stroke="#7FA82E" stroke-width="2">
    <rect x="140" y="114" width="48" height="40" rx="6"/>
    <rect x="194" y="114" width="48" height="40" rx="6"/>
    <rect x="248" y="114" width="48" height="40" rx="6"/>
    <rect x="302" y="114" width="48" height="40" rx="6"/>
  </g>
  <text x="370" y="140" font-size="15" fill="#14192A">4 bytes</text>

  <text x="40" y="196" font-size="16" font-weight="700" fill="#14192A">int8</text>
  <rect x="140" y="170" width="48" height="40" rx="6" fill="#FDF0DC" stroke="#E08A14" stroke-width="2"/>
  <text x="208" y="196" font-size="15" fill="#14192A">1 byte</text>

  <text x="480" y="140" font-size="15" fill="#5B6470">Enteros: cálculos más</text>
  <text x="480" y="162" font-size="15" fill="#5B6470">rápidos en un microcontrolador</text>
  <text x="480" y="184" font-size="15" fill="#5B6470">y 4 veces menos memoria.</text>

  <line x1="40" y1="236" x2="760" y2="236" stroke="#E5E8DF" stroke-width="2"/>

  <!-- model size -->
  <text x="40" y="268" font-size="15" font-weight="600" fill="#5B6470">Ejemplo: modelo con 100 000 pesos</text>
  <text x="40" y="307" font-size="16" font-weight="700" fill="#14192A">float32</text>
  <rect x="140" y="286" width="560" height="32" rx="6" fill="#7FA82E"/>
  <text x="688" y="308" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="end">≈ 400 KB</text>

  <text x="40" y="353" font-size="16" font-weight="700" fill="#14192A">int8</text>
  <rect x="140" y="332" width="140" height="32" rx="6" fill="#E08A14"/>
  <text x="296" y="354" font-size="15" font-weight="700" fill="#14192A">≈ 100 KB</text>

  <text x="40" y="394" font-size="14" fill="#5B6470">Solo cuentan los pesos: el intérprete y los buffers de activación ocupan memoria aparte.</text>
</svg>
