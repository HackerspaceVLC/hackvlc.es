<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#161A23"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- ESP32 module -->
  <g transform="translate(250 230)">
    <rect x="0" y="0" width="340" height="300" rx="14" fill="#1E2430" stroke="#9AA4B2" stroke-width="3"/>
    <!-- antenna -->
    <path d="M30 30 h60 v40 h40 v-40 h40 v40 h40 v-40 h40 v40 h40" fill="none" stroke="#9BC53D" stroke-width="6" stroke-linejoin="round"/>
    <!-- shield -->
    <rect x="30" y="100" width="280" height="170" rx="8" fill="#2A3140" stroke="#9AA4B2" stroke-width="3"/>
    <text x="170" y="196" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">ESP32</text>
    <!-- pins -->
    <g fill="#9AA4B2">
      <rect x="-14" y="110" width="14" height="8" rx="2"/><rect x="-14" y="134" width="14" height="8" rx="2"/>
      <rect x="-14" y="158" width="14" height="8" rx="2"/><rect x="-14" y="182" width="14" height="8" rx="2"/>
      <rect x="-14" y="206" width="14" height="8" rx="2"/><rect x="-14" y="230" width="14" height="8" rx="2"/>
      <rect x="-14" y="254" width="14" height="8" rx="2"/>
      <rect x="340" y="110" width="14" height="8" rx="2"/><rect x="340" y="134" width="14" height="8" rx="2"/>
      <rect x="340" y="158" width="14" height="8" rx="2"/><rect x="340" y="182" width="14" height="8" rx="2"/>
      <rect x="340" y="206" width="14" height="8" rx="2"/><rect x="340" y="230" width="14" height="8" rx="2"/>
      <rect x="340" y="254" width="14" height="8" rx="2"/>
    </g>
  </g>

  <!-- wifi arcs from board -->
  <g fill="none" stroke="#9BC53D" stroke-width="8" stroke-linecap="round">
    <path d="M610 180 a50 50 0 0 1 50 50"/>
    <path d="M610 140 a90 90 0 0 1 90 90" stroke-opacity="0.7"/>
    <path d="M610 100 a130 130 0 0 1 130 130" stroke-opacity="0.4"/>
  </g>

  <!-- cloud -->
  <path d="M790 250 h220 a55 55 0 0 0 0 -110 a80 80 0 0 0 -150 -30 a60 60 0 0 0 -70 140 z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  <!-- download arrow -->
  <g stroke="#FFA630" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M900 280 V 400"/>
    <path d="M850 350 L900 400 L950 350"/>
  </g>
  <!-- flash slots A/B -->
  <g transform="translate(715 440)">
    <rect x="0" y="0" width="110" height="90" rx="10" fill="none" stroke="#9BC53D" stroke-width="5"/>
    <text x="55" y="58" font-size="34" font-weight="700" fill="#9BC53D" text-anchor="middle">A</text>
    <rect x="130" y="0" width="110" height="90" rx="10" fill="#FFA630" fill-opacity="0.15" stroke="#FFA630" stroke-width="5"/>
    <text x="185" y="58" font-size="34" font-weight="700" fill="#FFA630" text-anchor="middle">B</text>
  </g>
  <text x="250" y="585" font-size="26" font-weight="700" fill="#9BC53D">OTA</text>
  <text x="1160" y="645" font-size="20" fill="#9AA4B2" text-anchor="end">hackvlc · blog</text>
</svg>
