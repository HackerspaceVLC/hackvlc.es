<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Cómo se leen los permisos de un fichero en Linux</title>
  <rect x="1" y="1" width="798" height="398" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
  <text x="40" y="48" font-size="20" font-weight="700" fill="#14192A">Cómo se leen los permisos: -rwxr-xr--</text>

  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="28" font-weight="700" text-anchor="middle">
    <!-- Tipo -->
    <rect x="100" y="80" width="50" height="60" rx="8" fill="#F4F5F7" stroke="#9AA4B2" stroke-width="2"/>
    <text x="125" y="120" fill="#5B6470">-</text>
    <!-- Propietario -->
    <rect x="174" y="80" width="50" height="60" rx="8" fill="#F3F8E8" stroke="#7FA82E" stroke-width="2"/>
    <text x="199" y="120" fill="#14192A">r</text>
    <rect x="230" y="80" width="50" height="60" rx="8" fill="#F3F8E8" stroke="#7FA82E" stroke-width="2"/>
    <text x="255" y="120" fill="#14192A">w</text>
    <rect x="286" y="80" width="50" height="60" rx="8" fill="#F3F8E8" stroke="#7FA82E" stroke-width="2"/>
    <text x="311" y="120" fill="#14192A">x</text>
    <!-- Grupo -->
    <rect x="360" y="80" width="50" height="60" rx="8" fill="#FDF3E4" stroke="#E08A14" stroke-width="2"/>
    <text x="385" y="120" fill="#14192A">r</text>
    <rect x="416" y="80" width="50" height="60" rx="8" fill="#FDF3E4" stroke="#E08A14" stroke-width="2"/>
    <text x="441" y="120" fill="#9AA4B2">-</text>
    <rect x="472" y="80" width="50" height="60" rx="8" fill="#FDF3E4" stroke="#E08A14" stroke-width="2"/>
    <text x="497" y="120" fill="#14192A">x</text>
    <!-- Resto -->
    <rect x="546" y="80" width="50" height="60" rx="8" fill="#F4F5F7" stroke="#9AA4B2" stroke-width="2"/>
    <text x="571" y="120" fill="#14192A">r</text>
    <rect x="602" y="80" width="50" height="60" rx="8" fill="#F4F5F7" stroke="#9AA4B2" stroke-width="2"/>
    <text x="627" y="120" fill="#9AA4B2">-</text>
    <rect x="658" y="80" width="50" height="60" rx="8" fill="#F4F5F7" stroke="#9AA4B2" stroke-width="2"/>
    <text x="683" y="120" fill="#9AA4B2">-</text>
  </g>

  <!-- Llaves -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M178 154 V162 H332 V154" stroke="#7FA82E"/>
    <path d="M364 154 V162 H518 V154" stroke="#E08A14"/>
    <path d="M550 154 V162 H704 V154" stroke="#9AA4B2"/>
    <path d="M104 154 V162 H146 V154" stroke="#9AA4B2"/>
  </g>

  <g font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">
    <text x="125" y="190">tipo</text>
    <text x="255" y="190">propietario (u)</text>
    <text x="441" y="190">grupo (g)</text>
    <text x="627" y="190">resto (o)</text>
  </g>
  <g font-size="14" fill="#5B6470" text-anchor="middle">
    <text x="125" y="212">d = carpeta</text>
    <text x="255" y="212">lee, escribe y ejecuta</text>
    <text x="441" y="212">lee y ejecuta</text>
    <text x="627" y="212">solo lee</text>
  </g>

  <!-- Octal -->
  <line x1="40" y1="240" x2="760" y2="240" stroke="#E5E8DF" stroke-width="2"/>
  <text x="40" y="276" font-size="15" fill="#5B6470">En número (octal):</text>
  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-weight="700" text-anchor="middle">
    <text x="255" y="282" font-size="30" fill="#7FA82E">7</text>
    <text x="441" y="282" font-size="30" fill="#E08A14">5</text>
    <text x="627" y="282" font-size="30" fill="#5B6470">4</text>
  </g>
  <g font-size="14" fill="#5B6470" text-anchor="middle">
    <text x="255" y="306">4 + 2 + 1</text>
    <text x="441" y="306">4 + 0 + 1</text>
    <text x="627" y="306">4 + 0 + 0</text>
  </g>

  <text x="40" y="352" font-size="15" fill="#14192A"><tspan font-weight="700">r</tspan> = 4 leer   <tspan font-weight="700" dx="12">w</tspan> = 2 escribir   <tspan font-weight="700" dx="12">x</tspan> = 1 ejecutar</text>
  <text x="760" y="352" text-anchor="end" font-size="16" font-weight="700" fill="#14192A" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">chmod 754 script.sh</text>
</svg>
