<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#161A23"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- PCB -->
  <rect x="250" y="330" width="640" height="230" rx="14" fill="#1F2A1A" stroke="#9BC53D" stroke-width="3"/>
  <g fill="none" stroke="#9BC53D" stroke-width="4" stroke-opacity="0.55" stroke-linecap="round">
    <path d="M330 470 H460 L500 430 H600"/>
    <path d="M700 470 H800"/>
    <path d="M330 510 H820"/>
  </g>
  <!-- pads -->
  <g fill="#FFA630">
    <circle cx="330" cy="470" r="12"/>
    <circle cx="600" cy="430" r="12"/>
    <circle cx="700" cy="470" r="12"/>
    <circle cx="800" cy="470" r="12"/>
  </g>
  <g fill="#161A23">
    <circle cx="330" cy="470" r="4"/>
    <circle cx="800" cy="470" r="4"/>
  </g>
  <!-- resistencia -->
  <path d="M600 430 V390 H640" fill="none" stroke="#9AA4B2" stroke-width="4"/>
  <path d="M700 470 V390 H660" fill="none" stroke="#9AA4B2" stroke-width="4"/>
  <rect x="628" y="376" width="44" height="28" rx="12" fill="#9AA4B2"/>
  <rect x="640" y="376" width="5" height="28" fill="#FFA630"/>
  <rect x="652" y="376" width="5" height="28" fill="#9BC53D"/>
  <!-- unión con estaño en el pad izquierdo de la resistencia -->
  <path d="M586 430 Q597 428 598 412 L602 412 Q603 428 614 430 Z" fill="#FFFFFF" fill-opacity="0.85"/>

  <!-- soldador -->
  <g transform="translate(6 30) rotate(-38 700 430)">
    <path d="M700 430 L736 418 L736 442 Z" fill="#FFFFFF"/>
    <rect x="736" y="418" width="140" height="24" fill="#9AA4B2"/>
    <rect x="876" y="408" width="60" height="44" rx="6" fill="#4A5363"/>
    <rect x="936" y="400" width="250" height="60" rx="26" fill="#FFA630"/>
    <g stroke="#161A23" stroke-opacity="0.35" stroke-width="3">
      <path d="M980 404 V456"/>
      <path d="M1000 402 V458"/>
      <path d="M1020 402 V458"/>
    </g>
  </g>
  <!-- punto caliente -->
  <circle cx="706" cy="460" r="22" fill="#FFA630" fill-opacity="0.18"/>

  <!-- humo -->
  <g fill="none" stroke="#9AA4B2" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
    <path d="M690 400 C670 370 710 350 690 320 C672 292 704 270 690 240"/>
    <path d="M712 396 C700 372 728 356 716 330"/>
  </g>

  <!-- bobina de estaño -->
  <circle cx="300" cy="210" r="70" fill="none" stroke="#9AA4B2" stroke-width="16"/>
  <circle cx="300" cy="210" r="34" fill="#161A23" stroke="#4A5363" stroke-width="6"/>
  <path d="M362 240 C440 280 520 300 586 418" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <text x="1160" y="640" text-anchor="end" font-size="20" fill="#9AA4B2">hackvlc · blog</text>
</svg>
