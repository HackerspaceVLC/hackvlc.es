<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFA630" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFA630" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="#161A23"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- Board -->
  <g transform="translate(180 170)">
    <rect x="0" y="0" width="460" height="330" rx="22" fill="#1E2532" stroke="#9BC53D" stroke-width="4"/>
    <!-- USB -->
    <rect x="-34" y="46" width="78" height="64" rx="8" fill="#9AA4B2"/>
    <rect x="-20" y="62" width="40" height="32" rx="4" fill="#161A23"/>
    <!-- power jack -->
    <rect x="-24" y="220" width="70" height="60" rx="10" fill="#2B3342" stroke="#9AA4B2" stroke-width="3"/>
    <!-- top header -->
    <rect x="150" y="22" width="280" height="30" rx="5" fill="#0F1218" stroke="#9AA4B2" stroke-width="2"/>
    <g fill="#9BC53D">
      <rect x="162" y="32" width="10" height="10"/><rect x="186" y="32" width="10" height="10"/><rect x="210" y="32" width="10" height="10"/><rect x="234" y="32" width="10" height="10"/><rect x="258" y="32" width="10" height="10"/><rect x="282" y="32" width="10" height="10"/><rect x="306" y="32" width="10" height="10"/><rect x="330" y="32" width="10" height="10"/><rect x="354" y="32" width="10" height="10"/><rect x="378" y="32" width="10" height="10"/><rect x="402" y="32" width="10" height="10"/>
    </g>
    <!-- bottom header -->
    <rect x="190" y="278" width="240" height="30" rx="5" fill="#0F1218" stroke="#9AA4B2" stroke-width="2"/>
    <g fill="#9AA4B2">
      <rect x="202" y="288" width="10" height="10"/><rect x="226" y="288" width="10" height="10"/><rect x="250" y="288" width="10" height="10"/><rect x="274" y="288" width="10" height="10"/><rect x="298" y="288" width="10" height="10"/><rect x="322" y="288" width="10" height="10"/><rect x="346" y="288" width="10" height="10"/><rect x="370" y="288" width="10" height="10"/><rect x="394" y="288" width="10" height="10"/>
    </g>
    <!-- MCU -->
    <rect x="200" y="120" width="120" height="120" rx="10" fill="#0F1218" stroke="#9AA4B2" stroke-width="3"/>
    <g stroke="#9AA4B2" stroke-width="3">
      <line x1="215" y1="120" x2="215" y2="106"/><line x1="240" y1="120" x2="240" y2="106"/><line x1="265" y1="120" x2="265" y2="106"/><line x1="290" y1="120" x2="290" y2="106"/>
      <line x1="215" y1="240" x2="215" y2="254"/><line x1="240" y1="240" x2="240" y2="254"/><line x1="265" y1="240" x2="265" y2="254"/><line x1="290" y1="240" x2="290" y2="254"/>
      <line x1="200" y1="145" x2="186" y2="145"/><line x1="200" y1="180" x2="186" y2="180"/><line x1="200" y1="215" x2="186" y2="215"/>
      <line x1="320" y1="145" x2="334" y2="145"/><line x1="320" y1="180" x2="334" y2="180"/><line x1="320" y1="215" x2="334" y2="215"/>
    </g>
    <circle cx="260" cy="180" r="14" fill="none" stroke="#9BC53D" stroke-width="3"/>
    <!-- onboard LED -->
    <rect x="96" y="150" width="22" height="14" rx="3" fill="#FFA630"/>
    <circle cx="107" cy="157" r="22" fill="url(#glow)"/>
  </g>

  <!-- wire from header to LED -->
  <path d="M587 202 C 640 140 720 140 760 230 L 800 300" fill="none" stroke="#FFA630" stroke-width="7" stroke-linecap="round"/>
  <path d="M563 202 C 610 70 990 60 1010 320" fill="none" stroke="#9AA4B2" stroke-width="7" stroke-linecap="round"/>

  <!-- breadboard -->
  <rect x="740" y="290" width="300" height="200" rx="16" fill="#1E2532" stroke="#9AA4B2" stroke-width="3"/>
  <g fill="#3A4354">
    <circle cx="770" cy="320" r="5"/><circle cx="800" cy="320" r="5"/><circle cx="830" cy="320" r="5"/><circle cx="860" cy="320" r="5"/><circle cx="890" cy="320" r="5"/><circle cx="920" cy="320" r="5"/><circle cx="950" cy="320" r="5"/><circle cx="980" cy="320" r="5"/><circle cx="1010" cy="320" r="5"/>
    <circle cx="770" cy="460" r="5"/><circle cx="800" cy="460" r="5"/><circle cx="830" cy="460" r="5"/><circle cx="860" cy="460" r="5"/><circle cx="890" cy="460" r="5"/><circle cx="920" cy="460" r="5"/><circle cx="950" cy="460" r="5"/><circle cx="980" cy="460" r="5"/><circle cx="1010" cy="460" r="5"/>
  </g>
  <!-- resistor -->
  <line x1="800" y1="380" x2="900" y2="380" stroke="#9AA4B2" stroke-width="5"/>
  <rect x="818" y="366" width="64" height="28" rx="12" fill="#9AA4B2"/>
  <rect x="832" y="366" width="7" height="28" fill="#161A23"/><rect x="848" y="366" width="7" height="28" fill="#161A23"/><rect x="866" y="366" width="7" height="28" fill="#FFA630"/>
  <line x1="800" y1="300" x2="800" y2="380" stroke="#FFA630" stroke-width="5"/>
  <!-- LED -->
  <circle cx="960" cy="360" r="90" fill="url(#glow)"/>
  <line x1="940" y1="380" x2="940" y2="440" stroke="#9AA4B2" stroke-width="5"/>
  <line x1="980" y1="380" x2="980" y2="430" stroke="#9AA4B2" stroke-width="5"/>
  <line x1="900" y1="380" x2="940" y2="380" stroke="#9AA4B2" stroke-width="5"/>
  <path d="M928 382 V346 A32 32 0 0 1 992 346 V382 Z" fill="#FFA630"/>
  <rect x="922" y="378" width="76" height="10" rx="3" fill="#E08A14"/>
  <path d="M980 430 H1010 V320" fill="none" stroke="#9AA4B2" stroke-width="5" stroke-linejoin="round"/>

  <text x="180" y="580" font-size="22" font-weight="700" fill="#9BC53D" letter-spacing="4">ARDUINO</text>
  <text x="1150" y="635" font-size="18" fill="#9AA4B2" text-anchor="end">hackvlc · blog</text>
</svg>
