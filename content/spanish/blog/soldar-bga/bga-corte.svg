<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
  <title id="t">Corte lateral de un BGA soldado sobre una PCB</title>
  <rect x="1" y="1" width="798" height="308" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
  <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#14192A">Un BGA visto en corte</text>

  <!-- PCB -->
  <rect x="90" y="186" width="440" height="58" rx="3" fill="#DDE8C4"/>
  <line x1="90" y1="208" x2="530" y2="208" stroke="#E08A14" stroke-width="3" stroke-opacity="0.5"/>
  <line x1="90" y1="226" x2="530" y2="226" stroke="#E08A14" stroke-width="3" stroke-opacity="0.5"/>
  <!-- vías dog bone -->
  <rect x="306" y="183" width="8" height="25" fill="#9AA4B2"/>
  <rect x="410" y="183" width="8" height="43" fill="#9AA4B2"/>
  <!-- pads y pistas cortas -->
  <g fill="#E08A14">
    <rect x="157" y="182" width="36" height="4"/>
    <rect x="211" y="182" width="36" height="4"/>
    <rect x="265" y="182" width="45" height="4"/>
    <rect x="319" y="182" width="36" height="4"/>
    <rect x="373" y="182" width="41" height="4"/>
    <rect x="427" y="182" width="36" height="4"/>
  </g>

  <!-- bolas -->
  <g fill="#B8C0CC">
    <ellipse cx="175" cy="166" rx="20" ry="16"/>
    <ellipse cx="229" cy="166" rx="20" ry="16"/>
    <ellipse cx="283" cy="166" rx="20" ry="16"/>
    <ellipse cx="337" cy="166" rx="20" ry="16"/>
    <ellipse cx="391" cy="166" rx="20" ry="16"/>
    <ellipse cx="445" cy="166" rx="20" ry="16"/>
  </g>

  <!-- chip -->
  <rect x="140" y="132" width="340" height="18" rx="2" fill="#7FA82E"/>
  <rect x="150" y="80" width="320" height="52" rx="4" fill="#3A4150"/>

  <!-- etiquetas -->
  <g stroke="#9AA4B2" stroke-width="1.5">
    <line x1="470" y1="104" x2="552" y2="104"/>
    <line x1="480" y1="141" x2="552" y2="141"/>
    <line x1="465" y1="166" x2="552" y2="166"/>
    <line x1="463" y1="184" x2="552" y2="191"/>
    <line x1="530" y1="222" x2="552" y2="222"/>
    <line x1="310" y1="212" x2="310" y2="262"/>
  </g>
  <g font-size="14" fill="#14192A">
    <text x="560" y="109">Encapsulado del chip</text>
    <text x="560" y="146">Sustrato del chip</text>
    <text x="560" y="171">Bolas de estaño</text>
    <text x="560" y="196">Pad de cobre en la PCB</text>
    <text x="560" y="227">PCB con capas internas</text>
    <text x="310" y="282" text-anchor="middle">Vía hacia una capa interna</text>
  </g>
</svg>
