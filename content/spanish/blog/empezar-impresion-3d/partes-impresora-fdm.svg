<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Partes de una impresora FDM</title>
  <desc id="d">Esquema de una impresora de cama móvil con bobina, extrusor, eje X, hotend, eje Z, pieza, cama caliente y placa de control.</desc>
  <rect x="1" y="1" width="798" height="518" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>
  <text x="32" y="44" font-size="18" font-weight="700" fill="#14192A">Impresora FDM de cama móvil</text>

  <!-- bobina -->
  <circle cx="100" cy="140" r="42" fill="none" stroke="#7FA82E" stroke-width="10"/>
  <circle cx="100" cy="140" r="12" fill="#5B6470"/>
  <path d="M100 98 C 160 40, 300 60, 325 180" fill="none" stroke="#7FA82E" stroke-width="3"/>
  <text x="100" y="212" font-size="15" font-weight="600" fill="#14192A" text-anchor="middle">Bobina de filamento</text>

  <!-- marco -->
  <rect x="194" y="106" width="12" height="340" fill="#5B6470"/>
  <rect x="434" y="106" width="12" height="340" fill="#5B6470"/>
  <rect x="194" y="104" width="252" height="10" fill="#5B6470"/>
  <rect x="170" y="445" width="300" height="35" rx="4" fill="#14192A"/>
  <rect x="398" y="452" width="56" height="20" rx="3" fill="#7FA82E"/>

  <!-- eje X -->
  <rect x="206" y="226" width="228" height="8" fill="#9AA4B2"/>
  <!-- carro, extrusor y hotend -->
  <rect x="306" y="180" width="38" height="25" rx="3" fill="#14192A"/>
  <rect x="300" y="205" width="50" height="50" rx="4" fill="#5B6470"/>
  <rect x="314" y="244" width="22" height="12" fill="#E08A14"/>
  <path d="M316 256 L334 256 L325 272 Z" fill="#E08A14"/>

  <!-- pieza y cama -->
  <g fill="#7FA82E">
    <rect x="300" y="282" width="50" height="118" rx="2"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.5" opacity="0.7">
    <line x1="300" y1="290" x2="350" y2="290"/>
    <line x1="300" y1="298" x2="350" y2="298"/>
    <line x1="300" y1="306" x2="350" y2="306"/>
    <line x1="300" y1="314" x2="350" y2="314"/>
    <line x1="300" y1="322" x2="350" y2="322"/>
    <line x1="300" y1="330" x2="350" y2="330"/>
    <line x1="300" y1="338" x2="350" y2="338"/>
    <line x1="300" y1="346" x2="350" y2="346"/>
    <line x1="300" y1="354" x2="350" y2="354"/>
    <line x1="300" y1="362" x2="350" y2="362"/>
    <line x1="300" y1="370" x2="350" y2="370"/>
    <line x1="300" y1="378" x2="350" y2="378"/>
    <line x1="300" y1="386" x2="350" y2="386"/>
    <line x1="300" y1="394" x2="350" y2="394"/>
  </g>
  <rect x="226" y="400" width="190" height="14" rx="3" fill="#E08A14"/>
  <rect x="250" y="414" width="140" height="31" fill="#9AA4B2" opacity="0.5"/>

  <!-- líneas guía -->
  <g stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="446" y1="140" x2="530" y2="140"/>
    <line x1="344" y1="186" x2="530" y2="186"/>
    <line x1="446" y1="230" x2="530" y2="230"/>
    <line x1="336" y1="268" x2="530" y2="268"/>
    <line x1="350" y1="366" x2="530" y2="366"/>
    <line x1="416" y1="407" x2="530" y2="407"/>
    <line x1="470" y1="462" x2="530" y2="462"/>
  </g>
  <g fill="#7FA82E">
    <circle cx="530" cy="140" r="3"/><circle cx="530" cy="186" r="3"/><circle cx="530" cy="230" r="3"/>
    <circle cx="530" cy="268" r="3"/><circle cx="530" cy="366" r="3"/><circle cx="530" cy="407" r="3"/><circle cx="530" cy="462" r="3"/>
  </g>

  <!-- etiquetas -->
  <g font-size="15" font-weight="600" fill="#14192A">
    <text x="542" y="138">Eje Z</text>
    <text x="542" y="184">Extrusor</text>
    <text x="542" y="228">Eje X</text>
    <text x="542" y="266">Hotend y boquilla</text>
    <text x="542" y="364">Pieza impresa</text>
    <text x="542" y="405">Cama caliente (eje Y)</text>
    <text x="542" y="460">Placa de control</text>
  </g>
  <g font-size="14" fill="#5B6470">
    <text x="542" y="156">Sube el cabezal capa a capa</text>
    <text x="542" y="202">Empuja el filamento</text>
    <text x="542" y="246">Mueve el cabezal en lateral</text>
    <text x="542" y="284">Funde el plástico</text>
    <text x="542" y="382">Se construye de abajo arriba</text>
    <text x="542" y="423">Avanza y retrocede</text>
    <text x="542" y="478">Ejecuta el G-code</text>
  </g>
</svg>
