<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#161A23"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- PCB -->
  <rect x="200" y="150" width="800" height="400" rx="16" fill="#1F2A1A" stroke="#9BC53D" stroke-width="3"/>

  <!-- pistas -->
  <g fill="none" stroke="#9BC53D" stroke-width="5" stroke-opacity="0.5" stroke-linecap="round">
    <path d="M352 300 V230 H260"/>
    <path d="M412 300 V250 H470"/>
    <path d="M352 460 V500 H260"/>
    <path d="M472 460 V510 H620 L660 470 H740"/>
    <path d="M820 380 H900 V250 H950"/>
  </g>

  <!-- SOIC-8 -->
  <g>
    <g fill="#FFA630">
      <rect x="338" y="290" width="28" height="44" rx="3"/>
      <rect x="398" y="290" width="28" height="44" rx="3"/>
      <rect x="458" y="290" width="28" height="44" rx="3"/>
      <rect x="518" y="290" width="28" height="44" rx="3"/>
      <rect x="338" y="426" width="28" height="44" rx="3"/>
      <rect x="398" y="426" width="28" height="44" rx="3"/>
      <rect x="458" y="426" width="28" height="44" rx="3"/>
      <rect x="518" y="426" width="28" height="44" rx="3"/>
    </g>
    <g fill="#9AA4B2">
      <rect x="344" y="300" width="16" height="36"/>
      <rect x="404" y="300" width="16" height="36"/>
      <rect x="464" y="300" width="16" height="36"/>
      <rect x="524" y="300" width="16" height="36"/>
      <rect x="344" y="424" width="16" height="36"/>
      <rect x="404" y="424" width="16" height="36"/>
      <rect x="464" y="424" width="16" height="36"/>
      <rect x="524" y="424" width="16" height="36"/>
    </g>
    <rect x="320" y="330" width="244" height="100" rx="8" fill="#2B313D" stroke="#4A5363" stroke-width="2"/>
    <circle cx="346" cy="408" r="8" fill="#4A5363"/>
    <!-- uniones brillantes -->
    <g fill="#FFFFFF" fill-opacity="0.85">
      <rect x="344" y="300" width="16" height="10" rx="4"/>
      <rect x="404" y="300" width="16" height="10" rx="4"/>
      <rect x="464" y="450" width="16" height="10" rx="4"/>
      <rect x="524" y="450" width="16" height="10" rx="4"/>
    </g>
  </g>

  <!-- resistencia 0805 en pinzas -->
  <g>
    <rect x="700" y="356" width="40" height="48" rx="4" fill="#FFA630"/>
    <rect x="800" y="356" width="40" height="48" rx="4" fill="#FFA630"/>
    <ellipse cx="720" cy="380" rx="14" ry="16" fill="#FFFFFF" fill-opacity="0.85"/>
    <g transform="translate(0,-60)">
      <rect x="712" y="360" width="116" height="40" rx="4" fill="#2B313D"/>
      <rect x="712" y="360" width="24" height="40" rx="4" fill="#9AA4B2"/>
      <rect x="804" y="360" width="24" height="40" rx="4" fill="#9AA4B2"/>
    </g>
    <!-- pinzas -->
    <path d="M738 292 L712 150 C700 80 740 40 770 40 C800 40 840 80 828 150 L802 292" fill="none" stroke="#9AA4B2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M770 360 V420" stroke="#9BC53D" stroke-width="3" stroke-dasharray="6 6"/>
  </g>

  <!-- etiqueta -->
  <text x="240" y="530" font-size="22" font-weight="700" fill="#9BC53D" letter-spacing="2">SMD</text>
  <text x="1160" y="640" text-anchor="end" font-size="20" fill="#9AA4B2">hackvlc · blog</text>
