<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5B6470"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#E08A14"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="798" height="398" rx="16" fill="#FFFFFF" stroke="#E5E8DF" stroke-width="2"/>

  <text x="40" y="60" font-size="16" font-weight="700" fill="#14192A">1. Contexto</text>
  <text x="40" y="82" font-size="14" fill="#5B6470">texto troceado en tokens</text>
  <text x="335" y="60" font-size="16" font-weight="700" fill="#14192A">2. Modelo</text>
  <text x="335" y="82" font-size="14" fill="#5B6470">calcula</text>
  <text x="500" y="60" font-size="16" font-weight="700" fill="#14192A">3. Probabilidades</text>
  <text x="500" y="82" font-size="14" fill="#5B6470">del siguiente token</text>

  <!-- tokens -->
  <rect x="40" y="166" width="44" height="36" rx="8" fill="#F2F7E8" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="62" y="189" text-anchor="middle" font-size="15" fill="#14192A">El</text>
  <rect x="92" y="166" width="72" height="36" rx="8" fill="#F2F7E8" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="128" y="189" text-anchor="middle" font-size="15" fill="#14192A">ESP32</text>
  <rect x="172" y="166" width="62" height="36" rx="8" fill="#F2F7E8" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="203" y="189" text-anchor="middle" font-size="15" fill="#14192A">tiene</text>
  <rect x="242" y="166" width="50" height="36" rx="8" fill="#F2F7E8" stroke="#7FA82E" stroke-width="1.5"/>
  <text x="267" y="189" text-anchor="middle" font-size="15" fill="#14192A">dos</text>

  <line x1="296" y1="184" x2="328" y2="184" stroke="#5B6470" stroke-width="2" marker-end="url(#a)"/>

  <!-- modelo -->
  <rect x="335" y="140" width="120" height="88" rx="12" fill="#14192A"/>
  <text x="395" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">LLM</text>
  <text x="395" y="202" text-anchor="middle" font-size="14" fill="#C9D0DA">parámetros</text>

  <line x1="459" y1="184" x2="492" y2="184" stroke="#5B6470" stroke-width="2" marker-end="url(#a)"/>

  <!-- probabilidades -->
  <text x="500" y="138" font-size="15" font-weight="700" fill="#14192A">núcleos</text>
  <rect x="580" y="125" width="124" height="18" rx="4" fill="#7FA82E"/>
  <text x="760" y="139" text-anchor="end" font-size="14" fill="#14192A">62 %</text>
  <text x="500" y="170" font-size="15" fill="#14192A">modos</text>
  <rect x="580" y="157" width="42" height="18" rx="4" fill="#C9D0DA"/>
  <text x="760" y="171" text-anchor="end" font-size="14" fill="#5B6470">21 %</text>
  <text x="500" y="202" font-size="15" fill="#14192A">pines</text>
  <rect x="580" y="189" width="18" height="18" rx="4" fill="#C9D0DA"/>
  <text x="760" y="203" text-anchor="end" font-size="14" fill="#5B6470">9 %</text>
  <text x="500" y="234" font-size="15" fill="#14192A">otros</text>
  <rect x="580" y="221" width="16" height="18" rx="4" fill="#C9D0DA"/>
  <text x="760" y="235" text-anchor="end" font-size="14" fill="#5B6470">8 %</text>

  <!-- realimentación -->
  <path d="M630 252 V296 H267 V208" fill="none" stroke="#E08A14" stroke-width="2.5" marker-end="url(#o)"/>
  <rect x="300" y="282" width="200" height="30" rx="15" fill="#FFF4E5" stroke="#E08A14" stroke-width="1.5"/>
  <text x="400" y="302" text-anchor="middle" font-size="14" font-weight="600" fill="#14192A">se elige «núcleos»</text>

  <text x="400" y="344" text-anchor="middle" font-size="15" fill="#14192A">4. El token elegido se añade al contexto y el ciclo vuelve a empezar</text>
  <text x="400" y="372" text-anchor="middle" font-size="14" fill="#5B6470">Probabilidades de ejemplo, solo ilustrativas</text>
</svg>
