<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9BC53D"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#161A23"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- bucle -->
  <circle cx="600" cy="337" r="200" fill="none" stroke="#9AA4B2" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 10"/>
  <path d="M676 152 A200 200 0 0 1 785 261" fill="none" stroke="#9BC53D" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M785 413 A200 200 0 0 1 676 522" fill="none" stroke="#9BC53D" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M524 522 A200 200 0 0 1 415 413" fill="none" stroke="#9BC53D" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>
  <path d="M415 261 A200 200 0 0 1 524 152" fill="none" stroke="#9BC53D" stroke-width="6" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- modelo (chip) -->
  <g stroke="#9AA4B2" stroke-width="4" stroke-linecap="round">
    <line x1="560" y1="262" x2="560" y2="282"/><line x1="600" y1="262" x2="600" y2="282"/><line x1="640" y1="262" x2="640" y2="282"/>
    <line x1="560" y1="392" x2="560" y2="412"/><line x1="600" y1="392" x2="600" y2="412"/><line x1="640" y1="392" x2="640" y2="412"/>
    <line x1="525" y1="297" x2="545" y2="297"/><line x1="525" y1="337" x2="545" y2="337"/><line x1="525" y1="377" x2="545" y2="377"/>
    <line x1="655" y1="297" x2="675" y2="297"/><line x1="655" y1="337" x2="675" y2="337"/><line x1="655" y1="377" x2="675" y2="377"/>
  </g>
  <rect x="545" y="282" width="110" height="110" rx="16" fill="#1F2533" stroke="#FFA630" stroke-width="4"/>
  <circle cx="600" cy="337" r="22" fill="none" stroke="#FFA630" stroke-width="4"/>
  <circle cx="600" cy="337" r="7" fill="#FFA630"/>

  <!-- herramientas -->
  <!-- terminal (arriba) -->
  <g transform="translate(600 137)">
    <rect x="-46" y="-36" width="92" height="72" rx="10" fill="#1F2533" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M-28 -10 L-14 2 L-28 14" fill="none" stroke="#9BC53D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-6" y1="16" x2="22" y2="16" stroke="#9BC53D" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- fichero (derecha) -->
  <g transform="translate(800 337)">
    <path d="M-30 -42 H14 L34 -22 V42 H-30 Z" fill="#1F2533" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M14 -42 V-22 H34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-18" y1="-4" x2="20" y2="-4" stroke="#9AA4B2" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="10" x2="20" y2="10" stroke="#9AA4B2" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="24" x2="6" y2="24" stroke="#9AA4B2" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- sensor (abajo) -->
  <g transform="translate(600 537)">
    <circle cx="0" cy="0" r="38" fill="#1F2533" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M-20 8 Q-10 -14 0 8 T20 8" fill="none" stroke="#FFA630" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="4" fill="#9BC53D"/>
  </g>
  <!-- engranaje / API (izquierda) -->
  <g transform="translate(400 337)">
    <g fill="#FFFFFF">
      <rect x="-7" y="-44" width="14" height="16" rx="3"/>
      <rect x="-7" y="28" width="14" height="16" rx="3"/>
      <rect x="-44" y="-7" width="16" height="14" rx="3"/>
      <rect x="28" y="-7" width="16" height="14" rx="3"/>
      <rect x="-7" y="-44" width="14" height="16" rx="3" transform="rotate(45)"/>
      <rect x="-7" y="28" width="14" height="16" rx="3" transform="rotate(45)"/>
      <rect x="-44" y="-7" width="16" height="14" rx="3" transform="rotate(45)"/>
      <rect x="28" y="-7" width="16" height="14" rx="3" transform="rotate(45)"/>
    </g>
    <circle cx="0" cy="0" r="30" fill="#1F2533" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#9BC53D" stroke-width="4"/>
  </g>

  <text x="60" y="80" font-size="22" font-weight="700" fill="#9BC53D" letter-spacing="3">AGENTE</text>
  <text x="1140" y="635" text-anchor="end" font-size="20" fill="#9AA4B2">hackvlc · blog</text>
</svg>
