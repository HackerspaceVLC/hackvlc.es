<text x="32" y="68" font-size="14" fill="#5B6470">Clasificación por función, no por posición física en la placa</text>
<text x="32" y="108" font-size="16" font-weight="700" fill="#14192A">Libres para empezar<tspan dx="10" font-weight="400" fill="#5B6470" font-size="14">uso general, entrada y salida</tspan></text>
