<text x="66" y="550" font-size="15" fill="#14192A">Lógica a 3,3 V: nunca conectes 5 V a un GPIO.</text>
<circle cx="52" cy="573" r="4" fill="#E08A14"/>
<text x="66" y="578" font-size="15" fill="#14192A">Con la WiFi activa, el ADC2 no funciona: lee analógico en ADC1 (GPIO 32 a 39).</text>
