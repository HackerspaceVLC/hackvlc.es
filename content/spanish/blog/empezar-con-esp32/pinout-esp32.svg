<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">GPIO del ESP32 por categorías</title>
<desc id="d">Pines libres, de strapping, de solo entrada, reservados para la flash y del puerto serie en el ESP32 original.</desc>
