  <rect x="420" y="100" width="340" height="150" rx="10" fill="#1F3A24" fill-opacity="0.08"/>
  <text x="210" y="92" font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">Sin teardrop</text>
  <text x="590" y="92" font-size="16" font-weight="700" fill="#14192A" text-anchor="middle">Con teardrop</text>

  <rect x="70" y="169" width="200" height="12" fill="#E08A14"/>
  <circle cx="290" cy="175" r="34" fill="#E08A14"/><circle cx="290" cy="175" r="15" fill="#FFFFFF" stroke="#C9CFC0" stroke-width="1.5"/>
  <circle cx="258" cy="175" r="16" fill="none" stroke="#5B6470" stroke-width="2" stroke-dasharray="4 3"/>

