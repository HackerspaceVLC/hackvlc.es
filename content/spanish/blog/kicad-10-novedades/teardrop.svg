  <path d="M590 169C615 168 630 153 652 146L652 204C630 197 615 182 590 181Z" fill="#E08A14"/>
  <circle cx="670" cy="175" r="34" fill="#E08A14"/><circle cx="670" cy="175" r="15" fill="#FFFFFF" stroke="#C9CFC0" stroke-width="1.5"/>

