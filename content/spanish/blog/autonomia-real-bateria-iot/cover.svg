<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#161A23"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- batería -->
  <g transform="translate(250 200)">
    <rect x="0" y="0" width="300" height="160" rx="22" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <rect x="300" y="52" width="26" height="56" rx="8" fill="#FFFFFF"/>
    <rect x="20" y="20" width="58" height="120" rx="8" fill="#9BC53D"/>
    <rect x="88" y="20" width="58" height="120" rx="8" fill="#9BC53D"/>
    <rect x="156" y="20" width="58" height="120" rx="8" fill="#9BC53D"/>
    <rect x="224" y="20" width="58" height="120" rx="8" fill="#9BC53D" fill-opacity="0.25"/>
  </g>

  <!-- perfil de corriente -->
  <path d="M120 540 L560 540 L560 512 L600 512 L600 488 L624 488 L624 410 L690 410 L690 540 L1080 540"
        fill="none" stroke="#FFA630" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M560 540 L560 512 L600 512 L600 488 L624 488 L624 410 L690 410 L690 540 Z" fill="#FFA630" fill-opacity="0.15"/>
  <line x1="120" y1="580" x2="1080" y2="580" stroke="#9AA4B2" stroke-width="2" stroke-opacity="0.5"/>

  <!-- reloj / ciclo -->
  <g transform="translate(860 280)" fill="none" stroke-linecap="round">
    <circle r="110" stroke="#9AA4B2" stroke-width="6" stroke-opacity="0.35"/>
    <path d="M0 -110 A110 110 0 1 1 -77.8 -77.8" stroke="#9BC53D" stroke-width="10"/>
    <line x1="0" y1="0" x2="0" y2="-66" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="0" y1="0" x2="48" y2="28" stroke="#FFFFFF" stroke-width="8"/>
    <circle r="9" fill="#FFFFFF" stroke="none"/>
  </g>

  <text x="250" y="170" font-size="26" font-weight="700" fill="#9BC53D" letter-spacing="2">IoT</text>
  <text x="1160" y="645" font-size="20" fill="#9AA4B2" text-anchor="end">hackvlc · blog</text>
</svg>
